[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "triagem-chamados-ia"
version = "0.1.0"
description = "API que faz a triagem de chamados de atendimento com IA (Claude), com mascaramento de dados pessoais (LGPD), plano B por regras e avaliação com gabarito."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Luis Gabriel Albrecht" }]
dependencies = [
    "anthropic>=2.4,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
