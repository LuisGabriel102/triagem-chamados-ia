name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: triagem_teste
          POSTGRES_USER: triagem
          POSTGRES_PASSWORD: triagem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triagem -d triagem_teste"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Conferir estilo (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Testes com SQLite
        run: pytest
      - name: Testes com PostgreSQL
        run: pytest
        env:
          DATABASE_URL_TESTE: postgresql+psycopg://triagem:triagem@localhost:5432/triagem_teste
      - name: Avaliação do plano B com o gabarito
        run: python -m avaliacao.avaliar --modo regras

  imagem-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Montar a imagem
        run: docker build -t triagem-chamados-ia .
      - name: Subir a imagem e conferir a triagem e o atendimento
        # Sem chave nenhuma: a triagem fica no plano B e a busca, por palavras. Basta para
        # ver que a imagem leva a base de ajuda e as lojas inventadas.
        run: |
          docker run -d --name api -p 8000:8000 triagem-chamados-ia
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/saude && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/demo/lojistas | grep -q loja-001
          curl -fsS -X POST http://127.0.0.1:8000/demo/atendimento \
            -H "Content-Type: application/json" \
            -d '{"mensagem": "A bobina acabou, onde compro?", "sessao": {"lojista_id": "loja-001"}}' \
            | grep -q '"origem_resposta":"plano_b"'
          docker rm -f api
